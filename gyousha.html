<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<title>ツジモト業者</title>
<style>
:root{--blue:#0a84ff;--red:#ff3b30;--green:#34c759;--orange:#ff9500;--purple:#5856d6;--bg:#f2f2f7;--line:#e5e5ea;--txt:#111;--gray:#6b6b70}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--txt);font-family:-apple-system,"Hiragino Sans","Yu Gothic UI",Meiryo,sans-serif;font-size:18px;line-height:1.45;padding-bottom:110px}
#hdr{padding:18px 20px 6px}
#hdr .site{font-size:30px;font-weight:800;letter-spacing:.02em}
#hdr .who{font-size:15px;color:var(--gray);margin-top:2px}
#hdr .who span{color:var(--blue);font-weight:600;margin-left:6px}
#top,#main{padding:8px 16px 0}
.topback{position:sticky;top:0;z-index:5;background:var(--bg);margin:-8px -16px 4px;padding:10px 16px;font-size:19px;font-weight:700;color:var(--blue);cursor:pointer}
.card{background:#fff;border:none;border-radius:18px;padding:16px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.note{background:#fff8e1;border-left:5px solid #ffb300;font-size:17px}
.note b{display:block;font-size:14px;margin-bottom:2px;color:#8a6d00}
.btn{display:block;width:100%;border:none;border-radius:16px;background:var(--blue);color:#fff;font-size:21px;font-weight:700;min-height:62px;margin:10px 0;padding:14px;text-align:center;cursor:pointer;font-family:inherit;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.btn.big{min-height:76px;font-size:25px;font-weight:800}
.btn.red{background:var(--red)}
.btn.gray{background:#fff;color:var(--blue)}
.btn.ok{background:var(--blue)}
.btn:disabled{opacity:.5}
.btn small{display:block;font-size:14px;font-weight:500;opacity:.85}
.row{display:flex;gap:10px}
.row .btn{flex:1;font-size:17px;min-height:56px;margin:6px 0;padding:10px 6px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 12px}
.chip{border:2px solid var(--line);color:var(--txt);background:#fff;border-radius:14px;padding:13px 16px;font-size:18px;font-weight:600;min-height:54px;cursor:pointer;transition:background .1s}
.chip.on{background:var(--blue);border-color:var(--blue);color:#fff}
.chip.on::before{content:"✓ "}
.chip.sub{font-size:16px;font-weight:500}
h2{font-size:22px;font-weight:800;margin:8px 0 6px}
h3{font-size:15px;margin:14px 0 4px;color:var(--gray);font-weight:600}
.stat{font-size:16px;color:var(--gray)}
.time{font-size:52px;font-weight:800;text-align:center;margin:6px 0;letter-spacing:.02em}
input[type=text],input[type=number],input[type=date],input[type=time],input[type=tel],textarea,select{width:100%;font-size:19px;padding:13px;border:2px solid var(--line);border-radius:14px;background:#fff;margin:4px 0 10px;font-family:inherit}
textarea{min-height:100px}
.stepper{display:flex;align-items:center;justify-content:center;gap:16px;margin:10px 0}
.stepper button{width:64px;height:64px;font-size:32px;border-radius:50%;border:none;background:#e5f0ff;color:var(--blue);font-weight:700}
.stepper .n{font-size:44px;font-weight:800;min-width:70px;text-align:center}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0}
.thumbs img{width:96px;height:96px;object-fit:cover;border-radius:12px}
.photoin{display:block;background:#fff;border:2px dashed #b9d7ff;border-radius:18px;padding:18px;text-align:center;color:var(--blue);font-weight:700;font-size:19px;margin:8px 0}
.photoin input{display:none}
.link{color:var(--blue);font-size:16px;font-weight:600}
.toast{position:fixed;left:16px;right:16px;bottom:100px;background:rgba(30,30,30,.92);color:#fff;padding:14px 16px;border-radius:14px;font-size:16px;z-index:25;text-align:center}
.tabs{display:flex;gap:2px;margin-bottom:12px;background:#e3e3e8;border-radius:12px;padding:3px}
.tabs div{flex:1;text-align:center;padding:9px 2px;border-radius:10px;font-weight:600;font-size:14px;color:#333;line-height:1.25}
details.shin summary{cursor:pointer;list-style:none}details.shin summary::-webkit-details-marker{display:none}details.shin[open] summary{margin-bottom:8px}details.shin .line{padding:3px 0;border-top:1px solid #eee}
.tabs div.on{background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.sw{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);font-size:17px}
.sw .tg{width:52px;height:32px;border-radius:16px;background:#e5e5ea;position:relative;flex:0 0 52px}
.sw .tg.on{background:var(--green)}
.sw .tg::after{content:"";position:absolute;top:2px;left:2px;width:28px;height:28px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:.15s}
.sw .tg.on::after{left:22px}
.line{padding:10px 0;border-bottom:1px solid var(--line);font-size:16px}
.pre{white-space:pre-wrap}
.small{font-size:14px;color:var(--gray)}
.center{text-align:center}
.ol{padding-left:22px;font-size:16px}
/* ホーム */
.status{display:flex;align-items:center;justify-content:space-between}
.status .t{font-size:13px;color:var(--gray)}
.status .v{font-size:32px;font-weight:800;letter-spacing:.02em}
.pill{font-size:13px;font-weight:700;border-radius:20px;padding:5px 11px;background:#eee;color:#666}
.pill.in{background:#e8f5e9;color:#2e7d32}.pill.out{background:#e5f0ff;color:var(--blue)}.pill.stop{background:#ffebee;color:#c62828}
.main{display:flex;justify-content:space-between;align-items:center;background:var(--blue);color:#fff;border-radius:18px;padding:16px 16px 16px 20px;margin-bottom:12px;min-height:80px;box-shadow:0 4px 12px rgba(10,132,255,.3);cursor:pointer}
.main .lb{font-size:26px;font-weight:800}
.main .lb small{display:block;font-size:13px;font-weight:500;opacity:.85}
.main.done{background:#fff;color:var(--gray);box-shadow:0 1px 3px rgba(0,0,0,.06)}
.ms{display:flex;align-items:center;gap:4px;background:rgba(255,255,255,.22);border-radius:14px;padding:4px}
.ms button{width:44px;height:44px;border:none;border-radius:11px;background:transparent;color:#fff;font-size:26px;font-weight:700}
.ms b{font-size:24px;min-width:34px;text-align:center}.ms i{font-style:normal;font-size:14px;margin-right:4px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.tile{background:#fff;border-radius:18px;padding:14px;min-height:108px;box-shadow:0 1px 3px rgba(0,0,0,.06);cursor:pointer;position:relative}
.tile .ic{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px;color:#fff}
.tile .l{font-size:17px;font-weight:700;margin-top:10px;line-height:1.3}
.tile .s{font-size:12px;color:var(--gray)}
.tile .bd{position:absolute;top:10px;right:10px;background:var(--red);color:#fff;font-size:12px;font-weight:700;border-radius:10px;padding:2px 8px}
.tile.ok .s{color:#2e7d32;font-weight:600}
#tabbar{position:fixed;left:0;right:0;bottom:0;background:rgba(249,249,251,.96);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid #d8d8dc;display:flex;justify-content:space-around;padding:8px 0 calc(10px + env(safe-area-inset-bottom));z-index:5}
#tabbar div{flex:1;text-align:center;font-size:11px;color:#8e8e93;cursor:pointer}
#tabbar div.on{color:var(--blue)}
#tabbar span{display:block;font-size:24px;line-height:1.2}
.menu .btn{text-align:left;padding-left:20px}
.chips.miss{outline:3px solid var(--red);outline-offset:4px;border-radius:12px;animation:mp 1s ease-in-out 2}
@keyframes mp{50%{outline-color:transparent}}
.kk .kk-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.kk .kk-q{font-size:16px}.kk .kk-q b,.kk .kk-a b{display:block;font-size:12px;color:var(--gray);font-weight:600}
.kk .kk-a{margin-top:8px;background:#eefaf1;border-radius:12px;padding:10px 12px;font-size:17px;font-weight:600}
.kk .kk-a b{color:#2e7d32}
#lb{position:fixed;inset:0;background:#000;z-index:30;display:flex;align-items:center;justify-content:center;touch-action:pinch-zoom}
#lb img{max-width:100%;max-height:100%;object-fit:contain}
#lb .lbx{position:fixed;top:calc(12px + env(safe-area-inset-top));right:14px;color:#fff;background:rgba(255,255,255,.2);border-radius:20px;padding:8px 14px;font-size:16px;font-weight:600}
#lb .lbs{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);color:#fff;background:var(--blue);border-radius:24px;padding:12px 22px;font-size:17px;font-weight:700;white-space:nowrap}
.shr{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:10px;font-size:15px}
.rpl{margin-top:8px;padding:10px 12px;border-radius:10px;background:#eefaf1;border-left:4px solid var(--green)}
.thumbs img[data-p]{cursor:zoom-in}
.kywarn{display:flex;align-items:center;gap:12px;background:#fff4e5;border:2px solid var(--orange);border-radius:18px;padding:14px;margin-bottom:12px;cursor:pointer;animation:kwp 1.6s ease-in-out infinite}
.kywarn .kw-ic{width:44px;height:44px;border-radius:12px;background:var(--orange);color:#fff;display:flex;align-items:center;justify-content:center;flex:0 0 44px}.kywarn .kw-ic svg{width:26px;height:26px}
.kywarn b{display:block;font-size:20px;color:#b35c00}.kywarn span{font-size:14px;color:#6b4a1f}
.kywarn .kw-go{margin-left:auto;background:var(--orange);color:#fff;font-weight:700;border-radius:12px;padding:8px 12px;font-size:15px;white-space:nowrap}
@keyframes kwp{0%,100%{box-shadow:0 0 0 0 rgba(255,149,0,.35)}50%{box-shadow:0 0 0 8px rgba(255,149,0,0)}}
.main.lock{background:#e5e5ea;color:#3a3a3c;box-shadow:none}
.main.lock .lb small{opacity:1;color:#6b6b70}
.main .qri{width:46px;height:46px;border-radius:14px;background:#fff;color:var(--blue);display:flex;align-items:center;justify-content:center}.main .qri svg{width:26px;height:26px}
.btn,.tile,.main,.chip,#tabbar div{transition:transform .08s,opacity .08s}
.btn:active,.tile:active,.main:active,.chip:active,#tabbar div:active{transform:scale(.96);opacity:.8}
#busy{position:fixed;inset:0;background:rgba(242,242,247,.55);z-index:20;display:flex;align-items:center;justify-content:center}
#busy .bx{background:rgba(30,30,30,.9);color:#fff;border-radius:18px;padding:22px 26px;text-align:center;font-size:16px;min-width:170px}
#busy .spin{width:34px;height:34px;border:4px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;margin:0 auto 10px;animation:sp 0.8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
#sheet{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:15;display:flex;align-items:flex-end}
#sheet .sh{background:var(--bg);width:100%;border-radius:22px 22px 0 0;padding:10px 18px calc(18px + env(safe-area-inset-bottom));animation:up .2s ease-out}
#sheet .grab{width:40px;height:5px;border-radius:3px;background:#c7c7cc;margin:0 auto 8px}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
.tile .ic{color:#fff}.tile .ic svg{width:25px;height:25px}
.tile{min-height:132px;padding:16px}.tile .l{font-size:19px;margin-top:14px}.tile .s{font-size:13px}
#tabbar span svg{width:27px;height:27px;display:inline-block}
#tabbar div{font-size:11px;font-weight:600}
.status .v{font-size:36px}
.main{min-height:92px}.main .lb{font-size:28px}
#hdr{padding:calc(14px + env(safe-area-inset-top)) 20px 8px}#hdr .site{font-size:32px;line-height:1.2}
/* 11/1 見直し：字は16px前後以上、色は濃く */
#qBanner b{display:inline;font-size:17px;color:#8a6d00}
.chip.free{border-style:dashed;color:var(--blue);background:#f5f9ff}
.chip.all{font-weight:700;border-width:2px}
.fbl{margin:6px 0}.fbi{display:inline-block;background:#eef3ff;border-radius:8px;padding:6px 10px;margin:3px 6px 3px 0;font-size:15px}.fbi b{color:#c62828;margin-left:6px;cursor:pointer}
.fls{margin-top:8px}.flk{display:block;background:#fff;border:2px solid var(--blue);color:var(--blue);border-radius:10px;padding:12px;margin:6px 0;font-size:17px;font-weight:700;text-decoration:none;text-align:center}
#tabbar div{color:#48484a}#tabbar div.on{color:var(--blue)}
:root{--blue:#0060df;--orange:#d9480f;--gray:#48484a}
.small{font-size:15px;color:#3a3a3c}
.tile .s{font-size:14px;color:#3a3a3c}
#tabbar div{font-size:13px}
#tabbar span svg{width:30px;height:30px}
.status .t{font-size:14px;color:#3a3a3c}
h3{font-size:16px;color:#3a3a3c}
.chip{font-size:19px;min-height:56px}.chip.sub{font-size:17px}
.main.lock .lb small{font-size:15px;color:#3a3a3c}
.kywarn .kw-go{background:#b45309}.kywarn span{font-size:15px}
.toast.stay{bottom:auto;top:calc(12px + env(safe-area-inset-top));background:#b42318;font-size:17px;font-weight:600;padding:16px 44px 16px 16px;text-align:left}
.toast.stay::after{content:"✕";position:absolute;right:14px;top:12px;font-size:20px}
.phbtn{display:inline-block;background:#e5f0ff;color:var(--blue);border-radius:12px;padding:10px 14px;font-weight:700;margin:6px 6px 0 0;font-size:16px}
.qr-chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}.qr-chips span{background:#eefaf1;color:#1e6b33;border-radius:12px;padding:9px 12px;font-size:15px;font-weight:600}
#bdw select{flex:1;min-width:0}
.newbtn{background:#fff4e5;border:2px solid var(--orange);color:#8a3500}
input[type=time],input[type=date]{-webkit-appearance:none;appearance:none;display:block;max-width:100%;min-height:54px;text-align:left}
.rec-edit{cursor:pointer}.rec-edit:active{background:#f2f2f7}
/* 中井の画面：1人ずつのカード（11/1 中井様「KYの後の見た目が悪い」） */
.rc{background:#fff;border-radius:16px;padding:14px;margin:10px 0 0;border:1px solid var(--line)}
.rc-h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.rc-h b{font-size:19px}
.rc-t{display:flex;gap:14px;flex-wrap:wrap;margin:6px 0 2px;font-size:17px;font-weight:700}
.rc-t span{white-space:nowrap}.rc-t i{font-style:normal;font-size:13px;color:var(--gray);font-weight:600;margin-right:3px}
.rc-sec{margin-top:10px;border-top:1px solid var(--line);padding-top:8px}
.rc-lb{font-size:13px;font-weight:700;color:var(--gray);margin-bottom:3px}
.rc-w{display:flex;flex-wrap:wrap;gap:5px}
.rc-w span{background:#e5f0ff;color:#003e8f;border-radius:9px;padding:4px 9px;font-size:15px;font-weight:600}
.rc-w span.k{background:#fff4e5;color:#8a3500}
.rc-kk{margin:4px 0 0;padding:0;list-style:none}
.rc-kk li{padding:6px 0 6px 10px;border-left:4px solid var(--orange);margin:6px 0;background:#fffaf3;border-radius:0 8px 8px 0}
.rc-kk li b{display:block;font-size:16px}.rc-kk li span{font-size:15px;color:#1e6b33}
.rc-mk{margin-top:6px;font-size:16px;font-weight:600}
.rc-warn{color:#b45309;font-size:14px;font-weight:700;margin-top:4px}
.rc-ng{color:var(--red);font-size:15px;font-weight:700}
.rc-ed{display:inline-block;margin-top:10px;color:var(--blue);font-weight:700;font-size:15px}
.miss{outline:3px solid var(--red);outline-offset:4px;border-radius:12px}
.btn,.chip,.tile,.main,.stepper button,#tabbar div{touch-action:manipulation}
.kk .kk-q b,.kk .kk-a b{font-size:14px}.pill{font-size:15px}
#sheet .sh.esh{max-height:88vh;max-height:88dvh;display:flex;flex-direction:column;padding-bottom:0}
#sheet .esh .esc{overflow:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;flex:1;padding-bottom:8px}
#sheet .esh .efoot{display:flex;gap:10px;padding:8px 0 calc(12px + env(safe-area-inset-bottom));background:var(--bg);border-top:1px solid var(--line)}
#sheet .esh .efoot .btn{margin:0;flex:1}
.dbar{padding:10px 12px}.dbar .row{align-items:center;gap:8px}.dbar .row .btn{flex:0 0 52px;min-height:50px;margin:0;font-size:18px}.dbar input[type=date]{flex:1;margin:0;min-height:50px;text-align:center}.dbar .qr-chips{margin:8px 0 0}
.mini{display:inline-block;color:var(--red);font-size:15px;font-weight:700;margin:-4px 0 10px}
</style>

<body>
<div id="hdr"><div class="site">ツジモト現場</div><div class="who">読み込み中…</div></div>
<div id="top"></div>
<div id="main"></div>
<div id="tabbar" style="display:none"></div>
<script>
const QS = new URLSearchParams(location.search);
const INIT = { siteId: QS.get('g') || '', admin: false, qr: QS.get('q') === '1', gk: QS.get('k') || '' };
if (QS.has('q')) { QS.delete('q'); history.replaceState(null, '', location.pathname + (QS.toString() ? '?' + QS.toString() : '')); }
// 何かで止まった時に白紙のままにしない（11/1 中井様、再読み込みで白紙になった）
function showStuck(msg) { const m = document.getElementById('main'); if (m && !m.innerHTML.trim()) m.innerHTML = '<div class="card"><b>うまく開けませんでした</b><div class="small">' + String(msg || '').replace(/</g, '&lt;') + '</div><button class="btn" onclick="location.reload()">もう一度開く</button></div>'; }
window.addEventListener('error', e => showStuck(e.message));
window.addEventListener('unhandledrejection', e => showStuck(e.reason && e.reason.message || e.reason));
setTimeout(() => showStuck('電波が弱いか、読み込みに時間がかかっています'), 20000);
// ホーム画面に追加したアイコンから開いた時（QRはいつもサファリで開くので、アイコンでは入場・退場は押せない）
const STANDALONE = !!(navigator.standalone || (window.matchMedia && matchMedia('(display-mode: standalone)').matches));
// QRを読んだ時刻は、このタブの間だけ覚えておく（読み込み直しても10分の間は押せるように）
const QR_AT = (() => {
  const qr = INIT.qr;   // 住所に q=1 が付いて開いた時だけ（アイコンから開くと付いていない）
  try {
    if (qr) { sessionStorage.setItem('tg.qr', JSON.stringify({ t: Date.now(), g: INIT.siteId })); return Date.now(); }
    const o = JSON.parse(sessionStorage.getItem('tg.qr') || 'null');
    if (o && INIT.siteId && o.g === INIT.siteId) return o.t;
  } catch (e) {}
  return qr ? Date.now() : 0;
})();
function qrOK() { return QR_AT && Date.now() - QR_AT < 10 * 60000; }   // QRを読んでから10分だけ「入りました・出ました」が押せる（11/1 見直し）
const TEST = /[?&]t=1(&|$)/.test(location.search);
function jpErr(e) { const m = String(e && e.message || e || ''); return /load failed|failed to fetch|network|abort|timeout|timed out/i.test(m) ? '電波が弱くて送れませんでした。電波の良い所でもう一度押してください' : (m || 'うまくいきませんでした'); }
window.addEventListener('unhandledrejection', e => { try { busy(false); toast(jpErr(e.reason), 0); } catch (x) {} });
const LS = { get: k => { try { return localStorage.getItem('tg.' + k); } catch (e) { return null; } }, set: (k, v) => { try { v == null ? localStorage.removeItem('tg.' + k) : localStorage.setItem('tg.' + k, v); return true; } catch (e) { return false; } } };
// 携帯ごとの印（見られる範囲は変えない。1台で何人もの名前を選ぶ・夜中に開く、を中井へ知らせるためだけに使う、11/2）
const DEV = LS.get('dev') || (() => { const v = 'd' + Date.now().toString(36) + Math.random().toString(36).slice(2, 10); LS.set('dev', v); return v; })();
document.addEventListener('touchstart', () => {}, { passive: true });   // アイフォンで押した時に縮む（押した感じを出す）
const S = { siteId: '', site: null, company: '', foreman: '', ninzu: 1, qrNone: false, boot: null, rec: null };
const $ = s => document.querySelector(s);
const $$ = (s, root) => Array.from((root || document).querySelectorAll(s));

async function cancel(what) {

  const mine = q.filter((x, i) => x.key === recKey() && x.fn === fn && !(inflight && i === 0));
  const r = Object.assign({}, S.rec || {}); r[what] = ''; if (what === '入場') r['人数'] = '';
  const forgotSent = what === '退場' && lastForgot() && !mine.some(x => x.payload.inTime);   // 押し忘れの「出ました」がもう届いていた
  if (what === '退場' && (mine.some(x => x.payload.inTime) || forgotSent)) { r['入場'] = ''; r['人数'] = ''; }   // 押し忘れの「出ました」は入った時刻も一緒に送っていた

  if (inflight || !mine.length) sendQ('torikeshi', Object.assign(P(), { what }), {});
  if (forgotSent) sendQ('torikeshi', Object.assign(P(), { what: '入場' }), {});   // 一緒に書いた入場も消す

// 1人ずつのカード（入退場・KY・進み・明日）。行を押すと直す窓
function recCard(r, i, kyOn, ro) {   // ro＝見るだけ（業者の画面）
  const pill = r.chushi ? '<span class="pill stop">' + esc(r.chushi) + '中止（' + esc(r.riyuu) + '）</span>' : r.out ? '<span class="pill out">退場済</span>' : r.in ? '<span class="pill in">作業中</span>' : '<span class="pill">まだ</span>';
  let h = '<div class="rc' + (ro ? '' : ' rec-edit" data-edit="' + i) + '"><div class="rc-h"><b>' + esc(r.company) + '　' + esc(r.foreman) + '</b>' + pill + '</div>';
  h += '<div class="rc-t"><span><i>入</i>' + esc(r.in || '—') + (r.qrIn ? '<i>QRなし</i>' : '') + '</span><span><i>出</i>' + esc(r.out || '—') + (r.qrOut ? '<i>QRなし</i>' : '') + '</span>' + (r.ninzu ? '<span>' + esc(r.ninzu) + '名</span>' : '') + '</div>';
  if (r.sagyou) {

      + (kk.length ? '<ol class="rc-kk">' + kk.map((k, j) => '<li><b>⚠ ' + esc(k) + '</b><span>→ ' + esc(ko[j] || '') + '</span></li>').join('') + '</ol>' : '')
      + (r.mokuhyou ? '<div class="rc-mk">🎯 ' + esc(r.mokuhyou) + '</div>' : '') + '</div>';
  } else if (kyOn && r.in && r.chushi !== '終日') h += '<div class="rc-sec rc-ng">⚠ KYまだ</div>';

  return h + (ro ? '' : '<span class="rc-ed">✎ 直す</span>') + '</div>';
}

  loadAdminImgs(); wireShare(c => c.dataset.nm || '現場の写真');
  if ($('#ahist')) call('adminHistory', A.pin, 30).then(list => { if (!$('#ahist')) return; $('#ahist').innerHTML = list.length ? list.map(k => kkCard(k, 'data-p').replace('<div class="card kk"', '<div class="card kk" data-nm="' + esc(pnm(k)) + '"')).join('') : '<div class="small">まだありません</div>'; loadAdminImgs(); }).catch(() => { if ($('#ahist')) $('#ahist').innerHTML = '<div class="small">読み込めませんでした</div>'; });
  if ($('#ashin')) call('adminShinki', A.pin, 120).then(list => { if (!$('#ashin')) return; $('#ashin').innerHTML = list.length ? list.map(x => shinCard(x, true)).join('') : '<div class="card">まだありません</div>'; }).catch(() => { if ($('#ashin')) $('#ashin').innerHTML = '<div class="small">読み込めませんでした</div>'; });
  if ($('#rhist')) call('adminRenrakuHistory', A.pin, 30).then(list => { if (!$('#rhist')) return; $('#rhist').innerHTML = list.length ? list.map(k => renCard(k, 'data-p', true)).join('') : '<div class="small">まだありません</div>'; loadAdminImgs(); }).catch(() => { if ($('#rhist')) $('#rhist').innerHTML = '<div class="small">読み込めませんでした</div>'; });
  // 返事にPDF・写真を付けられる（11/12）。文が無くてもファイルだけで送れる
  $$('[data-rreply]').forEach(b => b.onclick = async () => { const tx = b.parentElement.querySelector('textarea').value.trim(), fs = FB['r' + b.dataset.rreply] || []; if (!tx && !fs.length) { toast('返事を書いてください'); return; } busy(true, fs.length ? 'ファイルを送っています…' : '送っています…'); try { await call('adminRenrakuReply', A.pin, b.dataset.rreply, tx, fs); render.dirty = false; toast('返事を送りました'); adminStart(); } catch (e) { toast(jpErr(e), 0); } finally { busy(false); } });
  $$('[data-reply]').forEach(b => b.onclick = async () => { const tx = b.parentElement.querySelector('textarea').value.trim(), fs = FB['k' + b.dataset.reply] || []; if (!tx && !fs.length) { toast('返事を書いてください'); return; } busy(true, fs.length ? 'ファイルを送っています…' : '送っています…'); try { await call('adminReply', A.pin, b.dataset.reply, tx, fs); render.dirty = false; toast('返事を送りました'); adminStart(); } catch (e) { toast(jpErr(e), 0); } finally { busy(false); } });
  if ($('[data-chips="nsS"]')) $('[data-chips="nsS"]').addEventListener('chipchange', () => { const s = d.sites.find(x => x.name === chipVal('nsS')[0]); A.sendSite = s ? s.id : ''; $('[data-chips="nsC"]').outerHTML = chips('nsC', ['この現場の全員'].concat((d.siteCos || {})[A.sendSite] || []), { sub: true, value: 'この現場の全員' }); });
  if ($('#nsGo')) $('#nsGo').onclick = async () => {
    const s = d.sites.find(x => x.name === chipVal('nsS')[0]); if (!s) { toast('現場を選んでください', 0); return; }
    const to = chipVal('nsC')[0] || 'この現場の全員', tx = $('#nsT').value.trim(), fs = FB.ns || [];
    if (!tx && !fs.length) { toast('文かファイルを入れてください', 0); return; }
    if (!confirm(s.name + '　' + (to === 'この現場の全員' ? '全員' : to + 'さん') + 'へ送ります（前に同じ相手へ出した連絡は消えます）')) return;
    busy(true, fs.length ? 'ファイルを送っています…' : '送っています…');
    try { await call('adminNotice', A.pin, s.id, tx, { company: to === 'この現場の全員' ? '' : to, files: fs }); render.dirty = false; toast('送りました'); adminStart(); } catch (e) { toast(jpErr(e), 0); } finally { busy(false); }
  };
  $$('[data-noff]').forEach(x => x.onclick = async () => { if (!confirm('この連絡を消しますか（職長の画面から消えます）')) return; busy(true); try { await call('adminNoticeOff', A.pin, +x.dataset.noff); adminStart(); } catch (e) { toast(jpErr(e), 0); } finally { busy(false); } });
  $$('[data-done]').forEach(b => b.onclick = async () => { busy(true); try { await call('adminRenrakuDone', A.pin, b.dataset.done); adminStart(); } catch (e) { toast(jpErr(e), 0); } finally { busy(false); } });
  $$('.tg').forEach(t => t.onclick = async () => { const on = !t.classList.contains('on'); t.classList.toggle('on', on); try { await call('adminSwitch', A.pin, t.dataset.site, t.dataset.f, on); } catch (e) { toast(e.message); t.classList.toggle('on', !on); } });
  const safe = (fn, msg) => async () => { busy(true); try { await fn(); if (msg) toast(msg); } catch (e) { toast(jpErr(e), 0); } finally { busy(false); } };
  $$('[data-saveannai]').forEach(b => b.onclick = safe(() => call('adminAnnai', A.pin, b.dataset.saveannai, $('[data-annai="' + b.dataset.saveannai + '"]').value), '保存しました'));
  $$('[data-sendnotice]').forEach(b => b.onclick = safe(async () => { await call('adminNotice', A.pin, b.dataset.sendnotice, $('[data-notice="' + b.dataset.sendnotice + '"]').value.trim()); adminStart(); }, '連絡を出しました'));
  if ($('#myIn')) $('#myIn').onclick = () => { const sh = chipVal('ms')[0]; if (!sh) { toast('どこかを選んでください'); return; } safe(async () => { await call('adminTime', A.pin, { inout: '入', shurui: sh, genba: $('#mgOther').value.trim() || chipVal('mg')[0] || '', nani: chipVal('mn')[0] || '' }); adminStart(); })(); };
  if ($('#myOut')) $('#myOut').onclick = safe(async () => { await call('adminTime', A.pin, { inout: '出' }); adminStart(); });
}
// ---------- 一次の業者の画面（gyousha.html?k=鍵、11/2）：自分と協力業者の分を見る・質問に返事・中井に頼み事・協力業者を足す ----------
const G = { tab: '今日', date: '', data: null };
async function gStart(keep) {
  $('#tabbar').style.display = 'none';
  const y = keep ? window.scrollY : 0;
  // 2回目からの読み直しは画面を覆わない（窓口が混んだ時に何も押せなくなっていた、11/2）。古い読み直しの返事は捨てる
  const my = G.seq = (G.seq || 0) + 1, first = !G.data;
  if (first) busy(true, '読み込み中…'); else $('#hdr .who').textContent = '更新中…';
  let d0; try { d0 = await call('gyoushaToday', INIT.gk, G.date); } catch (e) { if (my !== G.seq) return; busy(false); if (!first) { toast(jpErr(e), 0); $('#hdr .who').textContent = '更新できませんでした'; return; } render('<div class="card"><b>開けませんでした</b><div class="small">' + esc(jpErr(e)) + '</div></div><button class="btn" id="gRe">もう一度読み込む</button>'); $('#gRe').onclick = () => gStart(); return; }
  if (my !== G.seq) return;
  G.data = d0; busy(false);
  const d = G.data;
  $('#hdr .site').textContent = d.company + 'さんの画面'; $('#hdr .who').innerHTML = jpDate(d.real) + '　' + esc(d.now);
  $('#top').innerHTML = '';
  // 裏の読み直しで描き直しても、書きかけの文は消さない
  const fkey = el => el.id || (el.dataset.gco ? 'co:' + el.dataset.gco : el.dataset.gfm ? 'fm:' + el.dataset.gfm : (el.closest('.card') && el.closest('.card').querySelector('[data-greply]') ? 're:' + el.closest('.card').querySelector('[data-greply]').dataset.greply : ''));
  const kept = {}; $$('#main textarea, #main input[type=text]').forEach(el => { const k = fkey(el); if (k && el.value) kept[k] = el.value; });
  const keptPh = $('#thumbs') ? PHOTOS.slice() : [];   // 選んだ写真・送る物・現場も消さない（11/10）
  if ($('[data-chips="gk"]')) G.form = { gk: chipVal('gk')[0], gs: chipVal('gs')[0] };
  gTab(G.tab);
  $$('#main textarea, #main input[type=text]').forEach(el => { const k = fkey(el); if (k && kept[k] && !el.value) el.value = kept[k]; });
  if ($('#thumbs') && keptPh.length) { PHOTOS = keptPh; drawThumbs(); }
  if (y) window.scrollTo(0, y);
}
function gTab(tab) {
  G.tab = tab; const d = G.data, many = d.sites.length > 1;
  const renMada = d.renraku.filter(k => !k.done && !k.reply), nWait = d.pending.length + renMada.length;   // 返事待ち＝ここどうしますか＋中井がまだの頼み事（11/10）
  let h = '<div class="tabs">' + ['今日', '返事', '中井へ送る', '新規入場', '会社'].map(t => '<div data-t="' + t + '" class="' + (t === tab ? 'on' : '') + '">' + t + (t === '返事' && nWait ? '（' + nWait + '）' : '') + '</div>').join('') + '</div>';
  if (tab === '今日') {
    h += '<div class="card dbar"><div class="row"><button class="btn gray" id="dPrev" aria-label="前の日">◀</button><input type="date" id="dPick" value="' + esc(d.today) + '" max="' + esc(d.real) + '"><button class="btn gray" id="dNext" aria-label="次の日"' + (d.today >= d.real ? ' disabled' : '') + '>▶</button></div><div class="qr-chips"><span data-jump="0">今日</span><span data-jump="-1">昨日</span></div></div><h2>' + jpDate(d.today) + (d.today === d.real ? '（今日）' : '') + '</h2>';
    (d.notices || []).forEach(n => h += '<div class="card note"><b>📢 中井より（' + esc(n.when.slice(5)) + '）' + esc(n.site) + (n.to ? '　' + esc(n.to) + 'さんへ' : '') + '</b><span class="pre">' + esc(n.text) + '</span>' + fileLinks(n.files) + '</div>');   // 中井からの連絡（11/12）
    if (!d.sites.length) h += '<div class="card">見られる現場がありません</div>';
    d.sites.forEach(s => { const sk = (d.shinki || []).filter(x => x['現場id'] === s.id && String(x['日時']).slice(0, 10) === d.today); h += '<div class="card"><h2>' + esc(s.name) + '</h2><div class="small">' + esc(s.cos.join('・')) + 'の分</div>' + (s.recs.length ? s.recs.map((r, i) => recCard(r, i, s.ky, true)).join('') : '<div class="small" style="margin-top:8px">まだ誰も押していません</div>') + (sk.length ? '<h3 style="margin-top:12px">この日の新規入場（' + sk.length + '名）</h3>' + sk.map(x => shinCard(x)).join('') : '') + '</div>'; });
    h += '<button class="btn gray" id="reload">更新</button>';
  }
  if (tab === '返事') {
    h += '<div class="small">職人さんからの「ここどうしますか」です。中井も同じ物を見ています。先に返した方の返事が職人さんに届きます</div>';
    if (!nWait) h += '<div class="card">返事待ちはありません</div>';
    d.pending.forEach(k => h += '<div class="card" data-nm="' + esc(pnm(k)) + '"><b>📷 ここどうしますか　' + esc(k.site) + '　' + esc(k.company) + ' ' + esc(k.foreman) + '</b><div class="small">' + esc(k.when) + (k.basho ? '　' + esc(k.basho) : '') + '</div><div class="pre">' + esc(k.text || '（写真のみ）') + '</div><div class="thumbs">' + k.photos.map(p => '<img data-gp="' + esc(p) + '" alt="写真">').join('') + '</div><div class="qr-chips">' + ['OKです', 'そのままで大丈夫です', '見に行きます', '電話します', '写真をもう1枚ください'].map(x => '<span data-qt="' + x + '">' + x + '</span>').join('') + '</div><textarea placeholder="返事（職長の画面に出ます）"></textarea><button class="btn ok" data-greply="' + esc(k.id) + '">返事を送る</button></div>');
    if (renMada.length) h += '<h2 style="margin-top:22px">中井の返事待ちの頼み事</h2><div class="small">頼み事には中井が返事します。返事が来るとここから消えて「中井へ送る」の下に残ります</div>' + renMada.map(k => renCard(k, 'data-gp', true)).join('');
    h += '<h2 style="margin-top:22px">これまでの返事（30日）</h2>' + (d.hist.length ? d.hist.map(k => kkCard(k, 'data-gp').replace('<div class="card kk"', '<div class="card kk" data-nm="' + esc(pnm(k)) + '"')).join('') : '<div class="small">まだありません</div>');
  }
  if (tab === '中井へ送る') {
    // 業者の画面から、現場に行かなくても頼み事・ここどうしますかを出せる（11/10 大畑さん：家や別の現場から中井に頼みたい）
    const f0 = G.form || {}, kind = f0.gk || '頼み事', nm0 = LS.get('gname') || d.name || '';
    h += '<div class="card"><h2>📝 中井へ送る</h2><h3>送る物</h3>' + chips('gk', ['頼み事', 'ここどうしますか'], { value: kind }) + (many ? '<h3>現場</h3>' + chips('gs', d.sites.map(s => s.name), { sub: true, value: f0.gs }) : '<div class="small">' + esc(d.sites[0] ? d.sites[0].name : '') + '</div>')
      + '<h3>送る人の名前</h3><input type="text" id="gNm" value="' + esc(nm0) + '" placeholder="例：大畑"><div class="small">この画面を借りて送る時は、送る人の名前に替えてください</div>'
      + '<div id="gBsW"' + (kind === 'ここどうしますか' ? '' : ' style="display:none"') + '><h3>場所</h3><input type="text" id="gBs" placeholder="例：南面 ベランダ笠木"></div>'
      + '<textarea id="gTx" placeholder="' + (kind === 'ここどうしますか' ? '聞きたいこと（声でも）' : '○○を持ってきて、など（声でも）') + '"></textarea>' + photoBox(3) + '<button class="btn big ok" id="gGo">中井に送る</button>' + (d.phone ? '<a class="btn gray" style="text-decoration:none" href="tel:' + esc(d.phone) + '">📞 中井に電話</a>' : '') + '</div>';
    h += '<h2 style="margin-top:22px">これまでの頼み事・ヒヤリハット（30日）</h2>' + (d.renraku.length ? d.renraku.map(k => renCard(k, 'data-gp', true)).join('') : '<div class="small">まだありません</div>');
    h += '<div class="small" style="margin-top:8px">ここどうしますかの返事は「返事」のタブに出ます</div>';
  }
  if (tab === '新規入場') h += '<div class="small">自分の会社と協力業者の新規入場です（新しい順・120日）。押すと中身が全部出ます</div>' + ((d.shinki || []).length ? d.shinki.map(x => shinCard(x, many)).join('') : '<div class="card">まだありません</div>');
  if (tab === '会社') {
    h += '<div class="small">協力業者の職長さんは、現場のQRを読んで、ここで足した会社と名前を選びます</div>';
    d.sites.forEach(s => { h += '<div class="card"><h2>' + esc(s.name) + '</h2><h3>この画面に出る会社</h3><div class="rc-w">' + s.cos.map(c => '<span>' + esc(c) + '</span>').join('') + '</div><h3>協力業者・職長を足す</h3><input type="text" data-gco="' + esc(s.id) + '" placeholder="会社名（例：○○塗装）"><input type="text" data-gfm="' + esc(s.id) + '" placeholder="職長の名前（例：山田）"><div class="small">職長が2人以上の時は「山田、佐藤」のように「、」で区切ります</div><button class="btn" data-gadd="' + esc(s.id) + '">足す</button></div>'; });
  }
  render(h);
  $$('.tabs div').forEach(t => t.onclick = () => gTab(t.dataset.t));
  if ($('#reload')) $('#reload').onclick = () => gStart();
  const go = v => { G.date = !v || v >= d.real ? '' : v; gStart(); };
  const shift = n => { const x = new Date(d.today + 'T00:00:00'); x.setDate(x.getDate() + n); go(x.getFullYear() + '-' + String(x.getMonth() + 1).padStart(2, '0') + '-' + String(x.getDate()).padStart(2, '0')); };
  if ($('#dPrev')) $('#dPrev').onclick = () => shift(-1);
  if ($('#dNext')) $('#dNext').onclick = () => shift(1);
  if ($('#dPick')) $('#dPick').onchange = () => { if ($('#dPick').value) go($('#dPick').value); };
  $$('[data-jump]').forEach(x => x.onclick = () => { const n = +x.dataset.jump; if (!n) return go(''); const t0 = new Date(d.real + 'T00:00:00'); t0.setDate(t0.getDate() + n); go(t0.getFullYear() + '-' + String(t0.getMonth() + 1).padStart(2, '0') + '-' + String(t0.getDate()).padStart(2, '0')); });
  $$('[data-qt]').forEach(x => x.onclick = () => { const ta = x.closest('.card').querySelector('textarea'); if (ta.value.indexOf(x.dataset.qt) >= 0) return; ta.value = (ta.value ? ta.value + ' ' : '') + x.dataset.qt; });
  const nmOf = el => { const c = el.closest('[data-nm]'); return c ? c.dataset.nm : '現場の写真'; };
  $$('img[data-gp]').forEach(async im => { try { im.src = await call('gyoushaPhoto', INIT.gk, im.dataset.gp); im.onclick = () => showPhoto(im.src, nmOf(im)); } catch (e) { im.alt = '×'; } });
  $$('span[data-gp]').forEach(b => b.onclick = async () => { busy(true, '写真を読んでいます…'); try { showPhoto(await call('gyoushaPhoto', INIT.gk, b.dataset.gp), nmOf(b)); } catch (e) { toast(jpErr(e), 0); } finally { busy(false); } });
  if ($('[data-chips="gk"]')) $('[data-chips="gk"]').addEventListener('chipchange', () => { const kk = chipVal('gk')[0] === 'ここどうしますか'; $('#gBsW').style.display = kk ? '' : 'none'; $('#gTx').placeholder = kk ? '聞きたいこと（声でも）' : '○○を持ってきて、など（声でも）'; });
  $$('[data-greply]').forEach(b => b.onclick = async () => {
    const tx = b.parentElement.querySelector('textarea').value.trim(); if (!tx) { toast('返事を書いてください'); return; }
    busy(true, '送っています…'); try { await call('gyoushaReply', INIT.gk, b.dataset.greply, tx); b.parentElement.querySelector('textarea').value = ''; toast('返事を送りました'); } catch (e) { toast(jpErr(e), 0); } finally { busy(false); }
    gStart();   // もう返事が出ていた時も、読み直して最新を出す
  });
  if ($('#gGo')) { const qid = 'g' + Date.now() + Math.random().toString(36).slice(2, 5); $('#gGo').onclick = async () => {
    const tx = $('#gTx').value.trim(); if (!tx && !PHOTOS.length) { toast('文か写真を入れてください'); return; }
    const sid = many ? (d.sites.find(s => s.name === chipVal('gs')[0]) || {}).id : (d.sites[0] || {}).id;
    if (!sid) { toast('現場を選んでください', 0); return; }
    const kk = chipVal('gk')[0] === 'ここどうしますか', nm = $('#gNm').value.trim();
    if (!nm) { toast('送る人の名前を入れてください', 0); return; }
    LS.set('gname', nm);
    busy(true, PHOTOS.length ? '写真を送っています…' : '送っています…');
    try { await call(kk ? 'gyoushaKakunin' : 'gyoushaRenraku', { key: INIT.gk, qid, siteId: sid, name: nm, basho: kk ? $('#gBs').value.trim() : '', text: tx, photos: PHOTOS }); } catch (e) { busy(false); toast(jpErr(e), 0); return; }
    busy(false); $('#gTx').value = ''; if ($('#gBs')) $('#gBs').value = ''; PHOTOS = []; G.form = null;
    toast(kk ? '中井に送りました。返事は「返事」のタブに出ます' : '中井に送りました', 5000); gStart();
  }; }
  $$('[data-gadd]').forEach(b => b.onclick = async () => {
    const id = b.dataset.gadd, co = $('[data-gco="' + id + '"]').value.trim(), fm = $('[data-gfm="' + id + '"]').value.trim();
    if (!co || !fm) { toast('会社名と職長の名前を入れてください', 0); return; }
    busy(true); try { await call('gyoushaAddSub', INIT.gk, id, co, fm); $('[data-gco="' + id + '"]').value = ''; $('[data-gfm="' + id + '"]').value = ''; toast('足しました'); gStart(); } catch (e) { toast(jpErr(e), 0); } finally { busy(false); }
  });
}
start();
